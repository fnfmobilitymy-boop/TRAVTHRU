name: Validate and deploy TRAVTHRU
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare a browser for the full test suite
        timeout-minutes: 8
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
            echo "CHROMIUM_PATH=$(node --input-type=module -e "import {chromium} from '@playwright/test'; console.log(chromium.executablePath())")" >> "$GITHUB_ENV"
          fi
      - name: Test multilingual website workflows
        run: npm test
      - name: Choose the configured Pages domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_host="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // empty')"
          if [ "$pages_host" = "www.travthru.com" ] || [ "$pages_host" = "travthru.com" ]; then
            echo 'SEO_DEPLOYMENT=production' >> "$GITHUB_ENV"
            echo "SEO_SITE_URL=https://${pages_host}/" >> "$GITHUB_ENV"
          elif [ -z "$pages_host" ]; then
            echo 'SEO_DEPLOYMENT=preview' >> "$GITHUB_ENV"
            echo 'SEO_SITE_URL=https://fnfmobilitymy-boop.github.io/TRAVTHRU/' >> "$GITHUB_ENV"
          else
            echo 'Unexpected Pages domain; review SEO configuration before publishing.' >&2
            exit 1
          fi
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-build
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
